[package]
name = "csv_viwer"
version = "0.1.0"
edition = "2024"
description = "Visualizador moderno de CSV e planilhas"

[[bin]]
name = "csv_viwer"
path = "src/main.rs"

[dependencies]
calamine = { version = "0.38", features = ["dates"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
csv = "1.4"
encoding_rs = "0.8"
chardetng = "1.0"
rayon = "1.12"
memchr = "2.8"
