[package]
name = "csv_viwer"
version = "0.1.0"
edition = "2024"
description = "Visualizador moderno de CSV e planilhas"

[[bin]]
name = "csv_viwer"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
    "x11",
] }
egui = "0.36"
egui-phosphor = "0.14"
calamine = { version = "0.38", features = ["dates"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
csv = "1.4"
rfd = "0.17"
encoding_rs = "0.8"
chardetng = "1.0"
rayon = "1.12"
memchr = "2.8"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"

# Arquivos abertos pelo Finder (ver src/macos.rs); já vêm junto com o eframe.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSAppleEventDescriptor",
    "NSAppleEventManager",
    "NSNotification",
    "NSString",
    "NSURL",
] }

[features]
# Prints automáticos da janela para testes visuais (ver src/devshot.rs).
devshot = []

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Debug um pouco otimizado (e dependências bem otimizadas): abrir arquivos
# grandes com `cargo run` continua rápido.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
